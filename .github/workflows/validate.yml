name: validate

on:
  push:
  pull_request:

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (editable, with test extras — single dependency source)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,examples]"
      - name: Skill frontmatter + manifest + schema sanity
        run: |
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob('skills/**/SKILL.md', recursive=True):
              d = yaml.safe_load(open(f).read().split('---', 2)[1])
              assert 'name' in d and 'description' in d, f
          plugin = json.load(open('.claude-plugin/plugin.json'))
          assert plugin['name'] and plugin['skills']
          from crossbio_validate import core          # schema resolvable from inside the package
          assert core.load_schema()['title']
          print('frontmatter + manifest + schema OK')
          PY
      - name: Tests (validator + viability + meta)
        run: python -m pytest tests/ -q
      - name: SCOUT example tests
        run: cd examples/scout && PYTHONPATH=. python -m pytest test_scout.py -q
      - name: ATTEST SCOUT fresh (against the CURRENT checkout — closes the stale-results hole)
        run: crossbio attest examples/scout/test_scout.py --bind examples/scout/scout.py --root . --out examples/scout/artifacts/results.json
      - name: SCOUT artifact chain validates (attested against fresh results)
        run: crossbio validate-chain examples/scout/artifacts
      - name: Wheel build + install test (catches schema-not-in-package)
        run: |
          pip install build
          python -m build --wheel
          pip install --force-reinstall --no-deps dist/*.whl
          crossbio attest examples/scout/test_scout.py --bind examples/scout/scout.py --root . --out examples/scout/artifacts/results.json
          crossbio validate-chain examples/scout/artifacts
