name: validate

on:
  push:
  pull_request:

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install jsonschema pytest
      - name: Skill frontmatter + manifest sanity
        run: |
          python - <<'PY'
          import glob, json, yaml
          for f in glob.glob('skills/**/SKILL.md', recursive=True):
              t = open(f).read()
              d = yaml.safe_load(t.split('---', 2)[1])
              assert 'name' in d and 'description' in d, f
          plugin = json.load(open('.claude-plugin/plugin.json'))
          assert plugin['name'] and plugin['skills']
          json.load(open('schemas/stage-schemas.json'))
          print('frontmatter + manifest + schema OK')
          PY
      - name: Validator unit tests
        run: python -m pytest tests/test_validator.py -v
