[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbio-algo-validator"
version = "0.2.4"
description = "crossbio-algo machine-checkable artifact validator (schema + chain + 8 content rules (5 cross-stage + 3 executable-trace))"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=7", "pyyaml>=6"]
examples = ["numpy>=1.26", "scikit-learn>=1.4"]   # for examples/scout/

[project.scripts]
crossbio = "crossbio_validate.cli:main"

[tool.setuptools]
packages = ["crossbio_validate", "crossbio_validate.schemas"]

[tool.setuptools.package-data]
"crossbio_validate.schemas" = ["*.json"]
