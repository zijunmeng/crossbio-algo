[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crossbio-algo-validator"
version = "0.2.1"
description = "crossbio-algo machine-checkable artifact validator (schema + chain + 5 cross-stage rules)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
crossbio = "crossbio_validate.cli:main"

[tool.setuptools]
packages = ["crossbio_validate"]
